<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management — Theme 05: Warm Parchment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      /*
       * THEME 05 — WARM PARCHMENT
       * 温暖羊皮纸底色 + 亚麻交叉细纹
       * 参考 Warburg Pincus / Advent International 等老牌 PE 风格
       * 传递：传承、稳健、低调的"老钱"气质
       * 区别于冷蓝系，走温暖中性路线
       */
      background-color: #ece6da;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #1e2438;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /*
     * 亚麻布纹理 — 水平 + 垂直极细网格
     * 模拟高档亚麻纸张的织物质感
     * 两层叠加：主网格 24px + 细分 8px（更低不透明度）
     */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 23px,
          rgba(90, 65, 35, 0.05) 23px,
          rgba(90, 65, 35, 0.05) 24px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 23px,
          rgba(90, 65, 35, 0.04) 23px,
          rgba(90, 65, 35, 0.04) 24px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 7px,
          rgba(90, 65, 35, 0.015) 7px,
          rgba(90, 65, 35, 0.015) 8px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 7px,
          rgba(90, 65, 35, 0.012) 7px,
          rgba(90, 65, 35, 0.012) 8px
        );
      pointer-events: none;
      z-index: 0;
    }

    /*
     * 光晕层：
     * 中心：温暖象牙白（非纯白，带暖调）收缩到 52% 覆盖
     * 左下：深棕暖调暗角
     * 右上：深海军蓝暗角（呼应品牌主色）
     */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 52% 46% at 50% 40%, rgba(255, 250, 240, 0.58) 0%, transparent 65%),
        radial-gradient(ellipse 55% 45% at 2%   98%, rgba(100, 70, 30,  0.08) 0%, transparent 70%),
        radial-gradient(ellipse 55% 45% at 98%  2%,  rgba(26,  38, 70,  0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.5s ease both; animation-delay: 0.5s; }
    .anim-linkedin   { animation: fadeUp 0.5s ease both; animation-delay: 0.7s; }
    .anim-email      { animation: fadeUp 0.5s ease both; animation-delay: 0.8s; }
    .anim-copyright  { animation: fadeUp 0.5s ease both; animation-delay: 0.9s; }
    .anim-disclaimer { animation: fadeUp 0.5s ease both; animation-delay: 1.0s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px 40px;
    }

    .logo-wrapper { margin-bottom: 40px; }
    .logo-wrapper img { width: 660px; max-width: 95vw; display: block; }

    .social-icons {
      margin-top: 200px; display: flex; gap: 32px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      border: 1.5px solid rgba(30, 36, 56, 0.28);
      border-radius: 10px;
      text-decoration: none; color: #2a3450;
      background-color: transparent;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
    }
    .social-btn:hover {
      border-color: #1e3060;
      background-color: rgba(26, 40, 80, 0.06);
      transform: translateY(-2px);
    }
    .social-btn svg { width: 22px; height: 22px; fill: currentColor; }

    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 24px 24px 32px; text-align: center;
    }
    .footer-copyright {
      font-size: 13px; font-weight: 400; color: #6a6050;
      letter-spacing: 0.01em; margin-bottom: 8px;
    }
    .footer-links { font-size: 13px; font-weight: 400; color: #6a6050; margin-bottom: 10px; }
    .footer-links a { color: #6a6050; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #1e3060; }
    .footer-links .divider { margin: 0 10px; opacity: 0.45; }
    .footer-disclaimer {
      font-size: 11px; font-weight: 400; color: #8a7e6e;
      max-width: 640px; margin: 0 auto; line-height: 1.65;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 95vw; }
      .social-btn { width: 46px; height: 46px; }
      .social-btn svg { width: 19px; height: 19px; }
      .footer-disclaimer { font-size: 9.5px; }
    }
  </style>
</head>
<body>
  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo-tight.png" alt="Originals Management" />
    </div>
    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>
  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>
</body>
</html>
