  <title>Originals Management — Theme 11: Deep Space Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: #05080f;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #b0c4e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Nebula overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(10,30,100,0.4) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Full-screen star field SVG */
    .starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.7s ease both; animation-delay: 0.4s; }
    .anim-tagline    { animation: fadeUp 0.7s ease both; animation-delay: 0.65s; }
    .anim-divider    { animation: fadeUp 0.5s ease both; animation-delay: 0.8s; }
    .anim-social     { animation: fadeUp 0.6s ease both; animation-delay: 0.9s; }
    .anim-copyright  { animation: fadeUp 0.5s ease both; animation-delay: 1.05s; }
    .anim-disclaimer { animation: fadeUp 0.5s ease both; animation-delay: 1.15s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px 40px;
      gap: 0;
    }

    /* Logo card */
    .logo-wrapper {
      margin-bottom: 36px;
    }
    .logo-wrapper img {
      width: 460px;
      max-width: 82vw;
      display: block;
      background: #ffffff;
      border-radius: 6px;
      box-shadow:
        0 0 40px rgba(30,80,200,0.2),
        0 0 0 1px rgba(100,150,255,0.1);
    }

    /* Tagline */
    .tagline {
      font-size: 13.5px;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: #6080a8;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Divider */
    .divider-line {
      width: 40px;
      height: 1px;
      background: rgba(80,120,200,0.4);
      margin-bottom: 32px;
    }

    /* Social icons */
    .social-icons {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: center;
    }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px;
      border: 1px solid rgba(100,130,220,0.35);
      border-radius: 50%;
      text-decoration: none;
      color: #8aaad4;
      background-color: transparent;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, transform 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(80,140,255,0.7);
      color: #c0d8ff;
      box-shadow: 0 0 12px rgba(80,140,255,0.3);
      transform: translateY(-2px);
    }
    .social-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Footer */
    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 20px 24px 30px; text-align: center;
    }
    .footer-copyright {
      font-size: 12.5px; font-weight: 400; color: #4a5e80;
      letter-spacing: 0.02em; margin-bottom: 7px;
    }
    .footer-links {
      font-size: 12.5px; font-weight: 400; color: #4a5e80; margin-bottom: 9px;
    }
    .footer-links a { color: #4a5e80; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #8aaad4; }
    .footer-links .sep { margin: 0 10px; opacity: 0.45; }
    .footer-disclaimer {
      font-size: 10.5px; font-weight: 400; color: #2a3a58;
      max-width: 640px; margin: 0 auto; line-height: 1.7;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 300px; }
      .tagline { font-size: 11px; letter-spacing: 0.15em; }
      .social-btn { width: 44px; height: 44px; }
      .social-btn svg { width: 18px; height: 18px; }
      .footer-disclaimer { font-size: 9.5px; }
    }
  </style>
</head>
