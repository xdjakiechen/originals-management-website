<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      /*
       * THEME 06 — INSTITUTIONAL
       * 机构级资产管理风格：深海军蓝基调 + 严格网格框架 + 干净边缘
       * 参考：Blackstone, KKR, Carlyle Group 等顶级 PE/HF 官网
       */
      background-color: #0a0f1e;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #e8edf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Structured grid background — strict orthogonal lines, no rotation */
    .bg-svg {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle top vignette to ground the composition */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, rgba(15, 35, 90, 0.45) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(5, 10, 25, 0.6) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.6s ease both; animation-delay: 0.4s; }
    .anim-tagline    { animation: fadeUp 0.6s ease both; animation-delay: 0.65s; }
    .anim-divider    { animation: fadeUp 0.6s ease both; animation-delay: 0.75s; }
    .anim-linkedin   { animation: fadeUp 0.6s ease both; animation-delay: 0.85s; }
    .anim-email      { animation: fadeUp 0.6s ease both; animation-delay: 0.95s; }
    .anim-copyright  { animation: fadeUp 0.6s ease both; animation-delay: 1.05s; }
    .anim-disclaimer { animation: fadeUp 0.6s ease both; animation-delay: 1.15s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 48px;
      gap: 0;
    }

    /* Logo: white-bg PNG as clean card on dark surface */
    .logo-wrapper {
      margin-bottom: 36px;
    }
    .logo-wrapper img {
      width: 480px; max-width: 78vw; display: block;
      border-radius: 4px;
    }

    /* Tagline — authoritative serif */
    .tagline {
      font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a9dbf;
      margin-bottom: 36px;
      text-align: center;
    }

    /* Thin horizontal rule as visual anchor */
    .rule {
      width: 48px; height: 1px;
      background: rgba(100, 140, 210, 0.5);
      margin-bottom: 36px;
    }

    .social-icons { display: flex; gap: 24px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px;
      border: 1px solid rgba(120, 160, 220, 0.25);
      border-radius: 3px;
      text-decoration: none; color: #7090c0;
      background-color: transparent;
      transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(100, 150, 230, 0.6);
      color: #a8c0e8;
      background-color: rgba(40, 70, 140, 0.12);
    }
    .social-btn svg { width: 20px; height: 20px; fill: currentColor; }

    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 20px 24px 28px; text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .footer-copyright {
      font-size: 11px; font-weight: 400; color: #4a5e7a;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .footer-links { font-size: 11px; font-weight: 400; color: #4a5e7a; margin-bottom: 8px; }
    .footer-links a { color: #4a5e7a; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #7090c0; }
    .footer-links .divider { margin: 0 8px; opacity: 0.4; }
    .footer-disclaimer {
      font-size: 10px; font-weight: 400; color: #2e3d55;
      max-width: 580px; margin: 0 auto; line-height: 1.55;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 280px; }
      .tagline { font-size: 11px; letter-spacing: 0.12em; }
      .social-btn { width: 44px; height: 44px; }
      .social-btn svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>

  <!-- Structured grid background: orthogonal rectangles on strict grid, no rotation -->
  <svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Grid unit: 120px -->
      <style>
        /* Stroke-only frames — architectural, no fill */
        .fr-thin   { fill: none; stroke: rgba(80, 120, 200, 0.09); stroke-width: 1; }
        .fr-mid    { fill: none; stroke: rgba(80, 120, 200, 0.14); stroke-width: 1; }
        .fr-bold   { fill: none; stroke: rgba(100, 150, 220, 0.20); stroke-width: 1.5; }
        /* Filled blocks — very subtle, axis-aligned only */
        .bl-faint  { fill: rgba(40, 70, 150, 0.06); }
        .bl-light  { fill: rgba(40, 70, 150, 0.10); }
        /* Accent lines — financial chart metaphor */
        .line-acc  { stroke: rgba(80, 130, 210, 0.18); stroke-width: 1; }
        .line-faint{ stroke: rgba(80, 130, 210, 0.08); stroke-width: 1; }
      </style>
    </defs>

    <!-- ── BACKGROUND GRID: faint full-canvas 120px grid ── -->
    <!-- Vertical lines -->
    <line x1="120"  y1="0" x2="120"  y2="900" class="line-faint"/>
    <line x1="240"  y1="0" x2="240"  y2="900" class="line-faint"/>
    <line x1="360"  y1="0" x2="360"  y2="900" class="line-faint"/>
    <line x1="480"  y1="0" x2="480"  y2="900" class="line-faint"/>
    <line x1="600"  y1="0" x2="600"  y2="900" class="line-faint"/>
    <line x1="720"  y1="0" x2="720"  y2="900" class="line-faint"/>
    <line x1="840"  y1="0" x2="840"  y2="900" class="line-faint"/>
    <line x1="960"  y1="0" x2="960"  y2="900" class="line-faint"/>
    <line x1="1080" y1="0" x2="1080" y2="900" class="line-faint"/>
    <line x1="1200" y1="0" x2="1200" y2="900" class="line-faint"/>
    <line x1="1320" y1="0" x2="1320" y2="900" class="line-faint"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="120" x2="1440" y2="120" class="line-faint"/>
    <line x1="0" y1="240" x2="1440" y2="240" class="line-faint"/>
    <line x1="0" y1="360" x2="1440" y2="360" class="line-faint"/>
    <line x1="0" y1="480" x2="1440" y2="480" class="line-faint"/>
    <line x1="0" y1="600" x2="1440" y2="600" class="line-faint"/>
    <line x1="0" y1="720" x2="1440" y2="720" class="line-faint"/>
    <line x1="0" y1="840" x2="1440" y2="840" class="line-faint"/>

    <!-- ── STRUCTURAL FRAMES: grid-aligned, no rotation ── -->

    <!-- Top-left: nested frames suggesting depth/layers -->
    <rect class="fr-bold"  x="0"    y="0"    width="360" height="360" />
    <rect class="fr-mid"   x="30"   y="30"   width="300" height="300" />
    <rect class="fr-thin"  x="60"   y="60"   width="240" height="240" />
    <rect class="bl-faint" x="0"    y="0"    width="120" height="120" />
    <rect class="bl-light" x="0"    y="0"    width="60"  height="60"  />

    <!-- Top-right: single large frame + subdivisions -->
    <rect class="fr-bold"  x="1080" y="0"    width="360" height="240" />
    <rect class="fr-mid"   x="1200" y="0"    width="240" height="120" />
    <rect class="bl-faint" x="1320" y="120"  width="120" height="120" />
    <rect class="bl-light" x="1320" y="0"    width="120" height="60"  />

    <!-- Mid-left: tall vertical frame -->
    <rect class="fr-bold"  x="0"    y="360"  width="240" height="360" />
    <rect class="fr-mid"   x="0"    y="480"  width="120" height="240" />
    <rect class="bl-faint" x="120"  y="360"  width="120" height="120" />

    <!-- Mid-right: horizontal band -->
    <rect class="fr-bold"  x="1200" y="360"  width="240" height="240" />
    <rect class="fr-mid"   x="1200" y="480"  width="240" height="120" />
    <rect class="bl-faint" x="1320" y="360"  width="120" height="120" />

    <!-- Bottom-left -->
    <rect class="fr-bold"  x="0"    y="720"  width="360" height="180" />
    <rect class="fr-mid"   x="120"  y="720"  width="240" height="120" />
    <rect class="bl-faint" x="0"    y="720"  width="120" height="180" />

    <!-- Bottom-right -->
    <rect class="fr-bold"  x="1080" y="720"  width="360" height="180" />
    <rect class="bl-faint" x="1200" y="720"  width="240" height="180" />
    <rect class="bl-light" x="1320" y="780"  width="120" height="120" />

    <!-- Center accent: thin square frame around focal point area -->
    <rect class="fr-mid"   x="480"  y="240"  width="480" height="360" />
    <rect class="fr-thin"  x="600"  y="300"  width="240" height="240" />

    <!-- ── FINANCIAL CHART LINES: horizontal accent lines suggesting data/market ── -->
    <!-- Left side ascending steps -->
    <polyline points="0,600 120,540 240,480 360,420 480,360" fill="none" class="line-acc"/>
    <polyline points="0,720 120,660 240,600 360,540" fill="none" stroke="rgba(80,130,210,0.10)" stroke-width="1"/>

    <!-- Right side descending -->
    <polyline points="1440,480 1320,420 1200,480 1080,420 960,360" fill="none" class="line-acc"/>
    <polyline points="1440,600 1320,540 1200,600 1080,540" fill="none" stroke="rgba(80,130,210,0.10)" stroke-width="1"/>

    <!-- Bottom horizontal accent -->
    <line x1="360" y1="840" x2="1080" y2="840" class="line-acc"/>
    <line x1="360" y1="860" x2="1080" y2="860" stroke="rgba(80,130,210,0.08)" stroke-width="1"/>
  </svg>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo.png" alt="Originals Management" />
    </div>

    <p class="tagline anim-tagline">Steady Growth through Institutional Rigor</p>

    <div class="rule anim-divider"></div>

    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>

</body>
</html>
