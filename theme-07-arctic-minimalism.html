<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      /*
       * THEME 07 — ARCTIC MINIMALISM
       * 北欧极地极简：极度留白、静默、克制
       * 参考：Norges Bank Investment Management、Pictet、北欧主权财富基金
       */
      background-color: #f7f9fc;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #0d1520;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Left-edge blue-grey accent block */
    .accent-block {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #1a4080 0%, rgba(26,64,128,0.2) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Two subtle horizontal rules across the full canvas */
    .h-line {
      position: fixed;
      left: 0; right: 0;
      height: 1px;
      background: rgba(0,0,0,0.06);
      pointer-events: none;
      z-index: 0;
    }
    .h-line-top    { top: 72px; }
    .h-line-bottom { bottom: 88px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.7s ease both; animation-delay: 0.3s; }
    .anim-tagline    { animation: fadeUp 0.7s ease both; animation-delay: 0.55s; }
    .anim-divider    { animation: fadeUp 0.7s ease both; animation-delay: 0.65s; }
    .anim-linkedin   { animation: fadeUp 0.7s ease both; animation-delay: 0.75s; }
    .anim-email      { animation: fadeUp 0.7s ease both; animation-delay: 0.85s; }
    .anim-copyright  { animation: fadeUp 0.7s ease both; animation-delay: 0.95s; }
    .anim-disclaimer { animation: fadeUp 0.7s ease both; animation-delay: 1.05s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 48px;
      gap: 0;
    }

    /* Logo: displayed directly, no filter */
    .logo-wrapper {
      margin-bottom: 160px;
    }
    .logo-wrapper img {
      width: 1380px; max-width: 95vw; display: block;
    }

    /* Tagline — thin weight, wide tracking, lowercase */
    .tagline {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: #8090a8;
      margin-bottom: 40px;
      text-align: center;
    }

    /* Minimal horizontal rule */
    .rule {
      width: 32px; height: 1px;
      background: rgba(26,64,128,0.25);
      margin-bottom: 40px;
    }

    .social-icons {
      margin-top: 200px; display: flex; gap: 20px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;
      border: 1px solid rgba(13,21,32,0.15);
      border-radius: 50%;
      text-decoration: none; color: #8090a8;
      background-color: transparent;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .social-btn:hover {
      border-color: #1a4080;
      color: #1a4080;
    }
    .social-btn svg { width: 18px; height: 18px; fill: currentColor; }

    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 18px 24px 24px; text-align: center;
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .footer-copyright {
      font-size: 10px; font-weight: 400; color: #a0aab8;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 5px;
    }
    .footer-links { font-size: 10px; font-weight: 400; color: #a0aab8; margin-bottom: 8px; }
    .footer-links a { color: #a0aab8; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #1a4080; }
    .footer-links .divider { margin: 0 8px; opacity: 0.4; }
    .footer-disclaimer {
      font-size: 9.5px; font-weight: 300; color: #b8c2ce;
      max-width: 840px; margin: 0 auto; line-height: 1.6;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 95vw; }
      .tagline { font-size: 11px; letter-spacing: 0.18em; }
      .social-btn { width: 40px; height: 40px; }
      .social-btn svg { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>

  <!-- Left accent block -->
  <div class="accent-block"></div>

  <!-- Subtle horizontal lines -->
  <div class="h-line h-line-top"></div>
  <div class="h-line h-line-bottom"></div>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo-tight.png" alt="Originals Management" />
    </div>

    <p class="tagline anim-tagline">disciplined capital. enduring value.</p>

    <div class="rule anim-divider"></div>

    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>

</body>
</html>
