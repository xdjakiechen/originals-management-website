<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      /*
       * THEME 09 — SWISS EDITORIAL
       * 瑞士国际排版风：白底，排版即装饰，负空间是奢侈品
       * 参考：Pictet Group, Lombard Odier, UBS
       */
      min-height: 100vh;
      background-color: #ffffff;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Fixed structural lines ── */

    /* Left vertical rule */
    .line-left {
      position: fixed;
      left: 48px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.08);
      z-index: 2;
      pointer-events: none;
    }

    /* Top horizontal rule */
    .line-top {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 0, 0, 0.08);
      z-index: 2;
      pointer-events: none;
    }

    /* ── Background watermark: "OM" large, bottom-right ── */
    .bg-watermark {
      position: fixed;
      right: -20px;
      bottom: -30px;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 280px;
      line-height: 1;
      color: #0a0a0a;
      opacity: 0.04;
      letter-spacing: -0.04em;
      user-select: none;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.7s ease both; animation-delay: 0.3s; }
    .anim-divider    { animation: fadeUp 0.7s ease both; animation-delay: 0.55s; }
    .anim-tagline    { animation: fadeUp 0.7s ease both; animation-delay: 0.65s; }
    .anim-linkedin   { animation: fadeUp 0.7s ease both; animation-delay: 0.80s; }
    .anim-email      { animation: fadeUp 0.7s ease both; animation-delay: 0.90s; }
    .anim-copyright  { animation: fadeUp 0.7s ease both; animation-delay: 1.00s; }
    .anim-disclaimer { animation: fadeUp 0.7s ease both; animation-delay: 1.10s; }

    /* ── Main content area ── */
    .page-content {
      position: relative;
      z-index: 1;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 24px 48px;
      gap: 0;
    }

    /* Logo: generous top breathing room */
    .logo-wrapper {
      margin-top: 60px;
      margin-bottom: 72px;
    }
    .logo-wrapper img {
      width: 1320px;
      max-width: 95vw;
      display: block;
    }

    /* Thin horizontal divider under logo text */
    .rule {
      width: 48px;
      height: 1px;
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    /* Tagline — ultra-light, spaced */
    .tagline {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #808080;
      margin-bottom: 48px;
      text-align: center;
    }

    /* Social icons */
    .social-icons {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 0;
      text-decoration: none;
      color: #0a0a0a;
      background-color: transparent;
      transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease;
    }
    .social-btn:hover {
      background-color: #0a0a0a;
      color: #ffffff;
      border-color: #0a0a0a;
    }
    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 20px 24px 28px;
      text-align: center;
      border-top: 1px solid rgba(0, 0, 0, 0.07);
    }

    .footer-copyright {
      font-size: 10px;
      font-weight: 400;
      color: #808080;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .footer-links {
      font-size: 10px;
      font-weight: 400;
      color: #808080;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .footer-links a {
      color: #808080;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: #0a0a0a; }
    .footer-links .divider { margin: 0 10px; opacity: 0.35; }

    .footer-disclaimer {
      font-size: 10px;
      font-weight: 300;
      color: #b0b0b0;
      max-width: 840px;
      margin: 0 auto;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .line-left { left: 24px; }
      .line-top  { top: 24px; }
      .logo-wrapper img { width: 95vw; }
      .logo-wrapper { margin-top: 40px; }
      .tagline { font-size: 10px; letter-spacing: 0.15em; }
      .social-btn { width: 40px; height: 40px; }
      .social-btn svg { width: 16px; height: 16px; }
      .bg-watermark { font-size: 180px; }
    }
  </style>
</head>
<body>

  <!-- Structural lines -->
  <div class="line-left"></div>
  <div class="line-top"></div>

  <!-- Background watermark -->
  <div class="bg-watermark" aria-hidden="true">OM</div>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo-tight.png" alt="Originals Management" />
    </div>

    <div class="rule anim-divider"></div>

    <p class="tagline anim-tagline">Alternative Investments · Since 2020</p>

    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>

</body>
</html>
