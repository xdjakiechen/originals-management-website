<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      /*
       * THEME 08 — CARBON & STEEL
       * 碳纤维钢铁工业感：深炭灰基调 + 碳纤维斜纹纹理 + 钢蓝点缀
       * 参考：Man Group, Citadel, D.E. Shaw — 精密机器质感
       */
      background-color: #1a1c20;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px);
      background-size: 8px 8px;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #c8d4e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Steel-blue glow overlay from top */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(30,80,160,0.15) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* Subtle bottom vignette */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 30% at 50% 100%, rgba(10,12,16,0.7) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.6s ease both; animation-delay: 0.4s; }
    .anim-tagline    { animation: fadeUp 0.6s ease both; animation-delay: 0.65s; }
    .anim-divider    { animation: fadeUp 0.6s ease both; animation-delay: 0.75s; }
    .anim-linkedin   { animation: fadeUp 0.6s ease both; animation-delay: 0.85s; }
    .anim-email      { animation: fadeUp 0.6s ease both; animation-delay: 0.95s; }
    .anim-copyright  { animation: fadeUp 0.6s ease both; animation-delay: 1.05s; }
    .anim-disclaimer { animation: fadeUp 0.6s ease both; animation-delay: 1.15s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 48px;
      gap: 0;
    }

    /* Logo: carbon card with metallic edge glow */
    .logo-wrapper {
      margin-bottom: 36px;
    }
    .logo-wrapper img {
      width: 460px; max-width: 78vw; display: block;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Tagline — precision mono feel via Manrope 500 */
    .tagline {
      font-family: 'Manrope', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #5080b0;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Steel rule — thin horizontal accent */
    .rule {
      width: 40px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(80,128,176,0.6), transparent);
      margin-bottom: 32px;
    }

    .social-icons { display: flex; gap: 20px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px;
      border: 1px solid rgba(80,128,176,0.3);
      border-radius: 2px;
      text-decoration: none; color: #5080b0;
      background-color: rgba(80,128,176,0.04);
      transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(80,128,176,0.7);
      color: #80aad0;
      background-color: rgba(80,128,176,0.10);
      box-shadow: 0 0 12px rgba(80,128,176,0.18), 0 0 0 1px rgba(80,128,176,0.15);
    }
    .social-btn svg { width: 20px; height: 20px; fill: currentColor; }

    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 18px 24px 26px; text-align: center;
      border-top: 1px solid rgba(80,128,176,0.08);
      background: rgba(10,11,14,0.4);
    }
    .footer-copyright {
      font-size: 11px; font-weight: 400; color: #485060;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .footer-links { font-size: 11px; font-weight: 400; color: #485060; margin-bottom: 8px; }
    .footer-links a { color: #485060; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #5080b0; }
    .footer-links .divider { margin: 0 8px; opacity: 0.4; }
    .footer-disclaimer {
      font-size: 10px; font-weight: 400; color: #2e3640;
      max-width: 580px; margin: 0 auto; line-height: 1.55;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 280px; }
      .tagline { font-size: 10px; letter-spacing: 0.18em; }
      .social-btn { width: 42px; height: 42px; }
      .social-btn svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo.png" alt="Originals Management" />
    </div>

    <p class="tagline anim-tagline">Precision.&nbsp; Resilience.&nbsp; Performance.</p>

    <div class="rule anim-divider"></div>

    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>

</body>
</html>
