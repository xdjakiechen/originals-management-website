<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management — Scattered Squares</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: #f8f9fd;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #1a2035;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Full-screen SVG background — scattered rotated squares */
    .bg-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Fade animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.5s ease both; animation-delay: 0.5s; }
    .anim-linkedin   { animation: fadeUp 0.5s ease both; animation-delay: 0.7s; }
    .anim-email      { animation: fadeUp 0.5s ease both; animation-delay: 0.8s; }
    .anim-copyright  { animation: fadeUp 0.5s ease both; animation-delay: 0.9s; }
    .anim-disclaimer { animation: fadeUp 0.5s ease both; animation-delay: 1.0s; }

    .page-content {
      position: relative; z-index: 1;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px 40px;
    }

    .logo-wrapper { margin-bottom: 40px; }
    .logo-wrapper img { width: 1560px; max-width: 95vw; display: block; }

    .social-icons { display: flex; gap: 32px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      border: 1.5px solid rgba(26, 53, 100, 0.3);
      border-radius: 10px;
      text-decoration: none; color: #1a3564;
      background-color: transparent;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
    }
    .social-btn:hover {
      border-color: #3b6fd4;
      background-color: rgba(59, 111, 212, 0.07);
      transform: translateY(-2px);
    }
    .social-btn svg { width: 22px; height: 22px; fill: currentColor; }

    footer {
      position: relative; z-index: 1;
      width: 100%; padding: 24px 24px 32px; text-align: center;
    }
    .footer-copyright {
      font-size: 13px; font-weight: 400; color: #4a5a78;
      letter-spacing: 0.01em; margin-bottom: 8px;
    }
    .footer-links { font-size: 13px; font-weight: 400; color: #4a5a78; margin-bottom: 10px; }
    .footer-links a { color: #4a5a78; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #3b6fd4; }
    .footer-links .divider { margin: 0 10px; opacity: 0.5; }
    .footer-disclaimer {
      font-size: 11px; font-weight: 400; color: #7a8ba8;
      max-width: 640px; margin: 0 auto; line-height: 1.65;
    }

    @media (max-width: 480px) {
      .logo-wrapper img { width: 90vw; }
      .social-btn { width: 46px; height: 46px; }
      .social-btn svg { width: 19px; height: 19px; }
      .footer-disclaimer { font-size: 9.5px; }
    }
  </style>
</head>
<body>

    <rect class="sq-fill-mid"    x="650"  y="360"  width="90"  height="90"  rx="3" transform="rotate(-18 695 405)" />

    <rect class="sq-stroke"      x="280"  y="660"  width="115" height="115" rx="2" transform="rotate(25 338 718)" />

    <rect class="sq-fill-mid"    x="900"  y="720"  width="140" height="140" rx="4" transform="rotate(-18 970 790)" />
    <rect class="sq-fill-strong" x="1060" y="790"  width="70"  height="70"  rx="3" transform="rotate(30 1095 825)" />
    <rect class="sq-fill-strong" x="1340" y="760"  width="90"  height="90"  rx="3" transform="rotate(-12 1385 805)" />
    <rect class="sq-stroke"      x="1200" y="700"  width="125" height="125" rx="2" transform="rotate(15 1263 763)" />

    <!-- Thin crossing accent lines -->
    <line x1="0"    y1="460" x2="480"  y2="380" stroke="rgba(160,185,235,0.2)" stroke-width="1"/>
    <line x1="960"  y1="520" x2="1440" y2="610" stroke="rgba(160,185,235,0.2)" stroke-width="1"/>
    <line x1="200"  y1="900" x2="700"  y2="550" stroke="rgba(160,185,235,0.18)" stroke-width="1"/>
    <line x1="750"  y1="0"   x2="1200" y2="480" stroke="rgba(160,185,235,0.15)" stroke-width="1"/>
  </svg>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo.png" alt="Originals Management" />
    </div>
    <div class="social-icons">

  <footer>
