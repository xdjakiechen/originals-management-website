<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Originals Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'Manrope', sans-serif;
    background: #080c14;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(20,50,120,0.25) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  .center-row {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 32px;
    z-index: 1;
    animation: fadeUp 0.8s ease forwards;
  }

  .center-row img.logo {
    width: 280px;
    display: block;
  }

  .vline {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  .icon-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    color: rgba(160,185,230,0.7);
    text-decoration: none;
    transition: color 0.2s ease, transform 0.2s ease;
  }

  .icon-link:hover {
    color: rgba(160,185,230,1);
    transform: scale(1.1);
  }

  .icon-link svg {
    width: 40px;
    height: 40px;
    fill: currentColor;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    padding: 16px 24px 20px;
    background: rgba(8,12,20,0.9);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 10;
  }

  footer p {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    line-height: 1.6;
  }

  footer a {
    color: rgba(255,255,255,0.2);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="center-row">
    <img src="logo.png" alt="Originals Management" class="logo" />

    <span class="vline"></span>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/company/originals-management" target="_blank" rel="noopener" class="icon-link" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>

    <span class="vline"></span>

    <!-- Email -->
    <a href="mailto:info@originals-management.com" class="icon-link" aria-label="Email">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </a>
  </div>

  <footer>
    <p>© 2025 Originals Management. All rights reserved.</p>
    <p>This website is intended solely for informational purposes and does not constitute an offer or solicitation.</p>
    <p><a href="privacy.html">Privacy Notice</a> | <a href="terms.html">Terms of Use</a></p>
  </footer>

</body>
</html>
