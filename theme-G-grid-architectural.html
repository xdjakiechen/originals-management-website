<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 40%;
      grid-template-rows: 72px 1fr 64px;
      min-height: 100vh;
      background: #f5f6f8;
      overflow: hidden;
      font-family: 'Manrope', sans-serif;
    }

    /* ── Top-left: Logo area ── */
    .header-left {
      grid-column: 1;
      grid-row: 1;
      padding: 0 48px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      border-right: 1px solid rgba(0,0,0,0.1);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.1s;
    }

    .header-left img {
      width: 480px;
      height: auto;
    }

    /* ── Top-right: empty ── */
    .header-right {
      grid-column: 2;
      grid-row: 1;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.15s;
    }

    /* ── Center-left: Main content ── */
    .content-left {
      grid-column: 1;
      grid-row: 2;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(0,0,0,0.1);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
      animation-delay: 0.3s;
    }

    .content-left h1 {
      font-size: clamp(84px, 10.5vw, 144px);
      font-weight: 300;
      color: #1a2a40;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    .divider-line {
      width: 40px;
      height: 2px;
      background: #1a3a6a;
      margin-bottom: 32px;
    }

    .social-links {
      display: flex;
      gap: 0;
      align-items: center;
    }

    .social-links a {
      font-size: 13px;
      color: #1a3a6a;
      text-decoration: none;
      letter-spacing: 0.05em;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .social-links a:hover {
      opacity: 0.6;
    }

    .social-links .sep {
      margin: 0 16px;
      color: rgba(0,0,0,0.2);
      font-size: 13px;
    }

    /* ── Center-right: Architectural SVG ── */
    .content-right {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      overflow: hidden;
      background: #e8eaee;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
      animation-delay: 0.45s;
    }

    .content-right svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Footer-left ── */
    .footer-left {
      grid-column: 1;
      grid-row: 3;
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.1);
      border-right: 1px solid rgba(0,0,0,0.1);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.6s;
    }

    .footer-left span,
    .footer-left a {
      font-size: 11px;
      color: #8a9ab0;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .footer-left a:hover {
      color: #1a3a6a;
    }

    /* ── Footer-right ── */
    .footer-right {
      grid-column: 2;
      grid-row: 3;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.65s;
    }

    .footer-right p {
      font-size: 9px;
      color: #a0a8b8;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    /* ── Animation ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Header Left -->
  <div class="header-left">
    <img src="logo.png" alt="Originals Management">
  </div>

  <!-- Header Right (empty) -->
  <div class="header-right"></div>

  <!-- Content Left -->
  <div class="content-left">
    <h1>Alternative<br>Investment<br>Management</h1>
    <div class="divider-line"></div>
    <div class="social-links">
      <a href="#">LinkedIn</a>
      <span class="sep">|</span>
      <a href="#">Contact</a>
    </div>
  </div>

  <!-- Content Right: Architectural SVG -->
  <div class="content-right">
    <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Bottom gradient overlay -->
        <linearGradient id="bottomGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(20,30,50,0)" />
          <stop offset="100%" stop-color="rgba(20,30,50,0.4)" />
        </linearGradient>
        <!-- Clip path for SVG area -->
        <clipPath id="svgClip">
          <rect width="600" height="800" />
        </clipPath>
      </defs>

      <!-- Parallel diagonal lines (hatching, architectural feel) -->
      <g clip-path="url(#svgClip)" stroke="rgba(60,80,110,0.15)" stroke-width="1" fill="none">
        <line x1="-200" y1="0"   x2="400"  y2="800" />
        <line x1="-180" y1="0"   x2="420"  y2="800" />
        <line x1="-160" y1="0"   x2="440"  y2="800" />
        <line x1="-140" y1="0"   x2="460"  y2="800" />
        <line x1="-120" y1="0"   x2="480"  y2="800" />
        <line x1="-100" y1="0"   x2="500"  y2="800" />
        <line x1="-80"  y1="0"   x2="520"  y2="800" />
        <line x1="-60"  y1="0"   x2="540"  y2="800" />
        <line x1="-40"  y1="0"   x2="560"  y2="800" />
        <line x1="-20"  y1="0"   x2="580"  y2="800" />
        <line x1="0"    y1="0"   x2="600"  y2="800" />
        <line x1="20"   y1="0"   x2="620"  y2="800" />
        <line x1="40"   y1="0"   x2="640"  y2="800" />
        <line x1="60"   y1="0"   x2="660"  y2="800" />
        <line x1="80"   y1="0"   x2="680"  y2="800" />
        <line x1="100"  y1="0"   x2="700"  y2="800" />
        <line x1="120"  y1="0"   x2="720"  y2="800" />
        <line x1="140"  y1="0"   x2="740"  y2="800" />
        <line x1="160"  y1="0"   x2="760"  y2="800" />
        <line x1="180"  y1="0"   x2="780"  y2="800" />
        <line x1="200"  y1="0"   x2="800"  y2="800" />
        <line x1="220"  y1="0"   x2="820"  y2="800" />
        <line x1="240"  y1="0"   x2="840"  y2="800" />
        <line x1="260"  y1="0"   x2="860"  y2="800" />
        <line x1="280"  y1="0"   x2="880"  y2="800" />
        <line x1="300"  y1="0"   x2="900"  y2="800" />
        <line x1="320"  y1="0"   x2="920"  y2="800" />
        <line x1="340"  y1="0"   x2="940"  y2="800" />
        <line x1="360"  y1="0"   x2="960"  y2="800" />
        <line x1="380"  y1="0"   x2="980"  y2="800" />
      </g>

      <!-- Architectural columns (thick vertical lines) -->
      <g stroke="rgba(80,100,130,0.25)" fill="none">
        <line x1="80"  y1="0" x2="80"  y2="800" stroke-width="4" />
        <line x1="200" y1="0" x2="200" y2="800" stroke-width="5" />
        <line x1="320" y1="0" x2="320" y2="800" stroke-width="3" />
        <line x1="440" y1="0" x2="440" y2="800" stroke-width="5" />
        <line x1="540" y1="0" x2="540" y2="800" stroke-width="3" />
      </g>

      <!-- Rectangular outlines (architectural facade windows/panels) -->
      <g stroke="rgba(60,80,110,0.2)" stroke-width="1" fill="none">
        <!-- Large panel top-left -->
        <rect x="40"  y="60"  width="140" height="200" />
        <!-- Large panel top-right -->
        <rect x="240" y="40"  width="160" height="240" />
        <!-- Mid panel left -->
        <rect x="60"  y="320" width="100" height="140" />
        <!-- Mid panel center -->
        <rect x="220" y="340" width="180" height="120" />
        <!-- Mid panel right -->
        <rect x="450" y="300" width="110" height="160" />
        <!-- Small accent top -->
        <rect x="480" y="60"  width="80"  height="60"  />
        <!-- Lower large panel -->
        <rect x="100" y="520" width="200" height="180" />
        <!-- Lower right panel -->
        <rect x="360" y="500" width="160" height="200" />
        <!-- Inner detail lines in large top panel -->
        <line x1="40"  y1="120" x2="180" y2="120" />
        <line x1="40"  y1="180" x2="180" y2="180" />
        <line x1="110" y1="60"  x2="110" y2="260" />
        <!-- Inner detail in center panel -->
        <line x1="240" y1="120" x2="400" y2="120" />
        <line x1="240" y1="200" x2="400" y2="200" />
        <line x1="320" y1="40"  x2="320" y2="280" />
      </g>

      <!-- Horizontal structural lines -->
      <g stroke="rgba(60,80,110,0.12)" stroke-width="1" fill="none">
        <line x1="0" y1="160" x2="600" y2="160" />
        <line x1="0" y1="320" x2="600" y2="320" />
        <line x1="0" y1="480" x2="600" y2="480" />
        <line x1="0" y1="640" x2="600" y2="640" />
      </g>

      <!-- Bottom gradient overlay -->
      <rect x="0" y="0" width="600" height="800" fill="url(#bottomGrad)" />
    </svg>
  </div>

  <!-- Footer Left -->
  <div class="footer-left">
    <span>© 2026 Originals Management. All Rights Reserved.</span>
    <span>
      <a href="#">Privacy Notice</a>
      &nbsp;|&nbsp;
      <a href="#">Terms of Use</a>
    </span>
  </div>

  <!-- Footer Right -->
  <div class="footer-right">
    <p>For informational purposes only. Not an offer to buy or sell securities.<br>Past performance is not indicative of future results.</p>
  </div>

</body>
</html>
