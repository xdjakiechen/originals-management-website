<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var ts=localStorage.getItem("om_auth_ts");if(!ts||Date.now()-Number(ts)>=86400000){location.replace("gate.html")}})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originals Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=EB+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      /*
       * THEME 10 — OBSIDIAN LUXURY
       * 黑曜石奢华感：近黑底色 + 极细金色线条 + 衬线字体
       * 参考：Hermès、Cartier、Pictet Private — 无需高调，自然尊贵
       */
      background-color: #0c0b0a;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #e8e0d0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Central warm gold halo — barely perceptible */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(160,120,50,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* Corner L-brackets — four corners, gold, ultra-thin */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      pointer-events: none; z-index: 1;
    }
    .corner svg { width: 100%; height: 100%; }

    .corner-tl { top: 28px; left: 28px; }
    .corner-tr { top: 28px; right: 28px; transform: scaleX(-1); }
    .corner-bl { bottom: 28px; left: 28px; transform: scaleY(-1); }
    .corner-br { bottom: 28px; right: 28px; transform: scale(-1,-1); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-logo       { animation: fadeUp 0.7s ease both; animation-delay: 0.3s; }
    .anim-tagline    { animation: fadeUp 0.7s ease both; animation-delay: 0.55s; }
    .anim-divider    { animation: fadeUp 0.7s ease both; animation-delay: 0.68s; }
    .anim-linkedin   { animation: fadeUp 0.7s ease both; animation-delay: 0.80s; }
    .anim-email      { animation: fadeUp 0.7s ease both; animation-delay: 0.92s; }
    .anim-copyright  { animation: fadeUp 0.7s ease both; animation-delay: 1.04s; }
    .anim-disclaimer { animation: fadeUp 0.7s ease both; animation-delay: 1.16s; }

    .page-content {
      position: relative; z-index: 2;
      width: 100%; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 48px;
    }

    /* Logo card with gold border glow */
    .logo-wrapper {
      margin-bottom: 38px;
    }
    .logo-wrapper img {
      width: 440px;
      max-width: 78vw;
      display: block;
      border-radius: 2px;
      box-shadow:
        0 0 0 1px rgba(160,130,60,0.2),
        0 8px 40px rgba(0,0,0,0.7);
    }

    /* Tagline — italic serif, gold-sand */
    .tagline {
      font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.10em;
      color: #b09050;
      margin-bottom: 28px;
      text-align: center;
    }

    /* Ultra-thin gold divider line */
    .rule {
      width: 40px; height: 1px;
      background: rgba(160,130,60,0.45);
      margin-bottom: 36px;
    }

    /* Horizontal accent line (optional decorative) */
    .center-line {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: min(480px, 70vw); height: 1px;
      background: rgba(160,130,60,0.15);
      top: calc(50% + 120px);
      pointer-events: none;
      z-index: 1;
    }

    .social-icons { display: flex; gap: 22px; align-items: center; justify-content: center; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px;
      border: 1px solid rgba(160,130,60,0.30);
      border-radius: 50%;
      text-decoration: none;
      color: #b09050;
      background-color: transparent;
      transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
    }
    .social-btn:hover {
      border-color: rgba(180,150,80,0.65);
      color: #d4a84b;
      background-color: rgba(160,130,60,0.06);
    }
    .social-btn svg { width: 19px; height: 19px; fill: currentColor; }

    footer {
      position: relative; z-index: 2;
      width: 100%; padding: 18px 24px 26px; text-align: center;
      border-top: 1px solid rgba(160,130,60,0.20);
    }
    .footer-copyright {
      font-size: 11px; font-weight: 400;
      color: #4a3e30;
      letter-spacing: 0.07em; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .footer-links {
      font-size: 11px; font-weight: 400;
      color: #4a3e30;
      margin-bottom: 8px;
    }
    .footer-links a {
      color: #4a3e30; text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: #786050; }
    .footer-links .divider { margin: 0 8px; opacity: 0.4; }
    .footer-disclaimer {
      font-size: 10px; font-weight: 400;
      color: #32281e;
      max-width: 580px; margin: 0 auto; line-height: 1.58;
    }

    @media (max-width: 480px) {
      .corner { width: 44px; height: 44px; }
      .corner-tl { top: 16px; left: 16px; }
      .corner-tr { top: 16px; right: 16px; }
      .corner-bl { bottom: 16px; left: 16px; }
      .corner-br { bottom: 16px; right: 16px; }
      .logo-wrapper img { width: 290px; }
      .tagline { font-size: 14px; }
      .social-btn { width: 44px; height: 44px; }
      .social-btn svg { width: 17px; height: 17px; }
    }
  </style>
</head>
<body>

  <!-- Four corner L-brackets in gold -->
  <div class="corner corner-tl" aria-hidden="true">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <polyline points="60,1 1,1 1,60" fill="none" stroke="rgba(180,150,80,0.25)" stroke-width="1"/>
    </svg>
  </div>
  <div class="corner corner-tr" aria-hidden="true">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <polyline points="60,1 1,1 1,60" fill="none" stroke="rgba(180,150,80,0.25)" stroke-width="1"/>
    </svg>
  </div>
  <div class="corner corner-bl" aria-hidden="true">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <polyline points="60,1 1,1 1,60" fill="none" stroke="rgba(180,150,80,0.25)" stroke-width="1"/>
    </svg>
  </div>
  <div class="corner corner-br" aria-hidden="true">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <polyline points="60,1 1,1 1,60" fill="none" stroke="rgba(180,150,80,0.25)" stroke-width="1"/>
    </svg>
  </div>

  <!-- Optional: subtle horizontal center-divider line -->
  <div class="center-line" aria-hidden="true"></div>

  <div class="page-content">
    <div class="logo-wrapper anim-logo">
      <img src="logo.png" alt="Originals Management" />
    </div>

    <p class="tagline anim-tagline">Capital Preserved. Legacy Built.</p>

    <div class="rule anim-divider"></div>

    <div class="social-icons">
      <a href="#" class="social-btn anim-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:#" class="social-btn anim-email" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <p class="footer-copyright anim-copyright">© 2026 Originals Management. All Rights Reserved.</p>
    <p class="footer-links anim-copyright">
      <a href="#">Privacy Notice</a><span class="divider">|</span><a href="#">Terms of Use</a>
    </p>
    <p class="footer-disclaimer anim-disclaimer">
      Originals Management maintains a single website. Any representations to the contrary and any other websites are not endorsed by Originals Management.
    </p>
  </footer>

</body>
</html>
